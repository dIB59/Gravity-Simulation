[package]
name = "graviplex-sim"
version = "0.3.0"
edition = "2021"

[dependencies]
graviplex = { git = "https://github.com/dib59/Graviplex.git", features = ["gui", "physics"], rev = "77bd2c23884ca08830f0fb396942e8a7faac8b1d" }
bytemuck = "1.22.0"
wgpu = "26.0.1"
winit = "0.30.7"
egui = { version = "0.33.0", default-features = true }
egui-winit = { version = "0.33.0", default-features = false }
ultraviolet = "0.9.2"
rand = "0.9.2"
rayon = "1.10"
pollster = "0.4.0"
env_logger = "0.11.6"
log = "0.4.22"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
