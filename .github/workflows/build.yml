name: Build, push, and deploy

on:
  push:
    branches: [main, wasm-target]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha7: ${{ steps.vars.outputs.sha7 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ─── Rust toolchain + WASM target + wasm-bindgen-cli ───────────────────
      - name: Install Rust nightly + wasm32 target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            -y --default-toolchain nightly --profile minimal --target wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Cache target dir
        uses: actions/cache@v4
        with:
          path: target
          key: target-wasm-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'src/**') }}

      - name: Install wasm-bindgen-cli
        run: |
          if ! command -v wasm-bindgen >/dev/null; then
            cargo install --locked wasm-bindgen-cli@0.2.121
          fi

      # ─── Build the WASM artifact ───────────────────────────────────────────
      - name: cargo build --target wasm32-unknown-unknown
        run: |
          cargo build --release --target wasm32-unknown-unknown --no-default-features

      - name: wasm-bindgen → web/pkg
        run: |
          mkdir -p web/pkg
          wasm-bindgen --target web --out-dir web/pkg \
            ./target/wasm32-unknown-unknown/release/graviplex_sim.wasm

      # ─── Build & push Docker image (nginx + static files) ──────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push-to-deploy: bump the gravity-simulation image tag in the homelab repo,
  # which triggers the homelab CI to terraform apply → K8s rolling restart.
  deploy:
    needs: build
    # Deploy on both main and wasm-target while the WASM port is being
    # iterated. Drop wasm-target once the branch merges to main.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wasm-target'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          repository: dIB59/homelab
          token: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          path: homelab

      - name: Bump gravity-simulation image tag in apps.auto.tfvars
        working-directory: homelab
        env:
          SHA7: ${{ needs.build.outputs.sha7 }}
        run: |
          set -e
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("apps.auto.tfvars")
          src = p.read_text()
          sha = os.environ["SHA7"]
          new_tag = f"ghcr.io/dib59/gravity-simulation:sha-{sha}"
          pattern = re.compile(
              r'("gravity-simulation"\s*=\s*\{[^{}]*?image\s*=\s*")[^"]+(")',
              re.DOTALL,
          )
          new_src, n = pattern.subn(rf"\g<1>{new_tag}\g<2>", src, count=1)
          if n != 1:
              raise SystemExit("Could not find gravity-simulation image line")
          p.write_text(new_src)
          print(f"Bumped gravity-simulation image to {new_tag}")
          PY

      - name: Commit and push
        working-directory: homelab
        env:
          SHA7: ${{ needs.build.outputs.sha7 }}
        run: |
          set -e
          git config user.name  "gravity-deploy[bot]"
          git config user.email "gravity-deploy@users.noreply.github.com"

          if git diff --quiet apps.auto.tfvars; then
            echo "No image change — skipping commit."
            exit 0
          fi

          git add apps.auto.tfvars
          git commit -m "Bump gravity-simulation to sha-${SHA7}"
          git push
