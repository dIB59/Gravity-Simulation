[package]
name = "graviplex-sim"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Multi-threaded CPU work via rayon. Default on; the WASM build disables it
# (will move to wasm-bindgen-rayon for true multi-threaded WASM in a follow-up).
parallel = ["dep:rayon"]
default = ["parallel"]

[dependencies]
# Local dev path used during the WASM port. CI/Dockerfile patch this back to a
# git URL with branch = "wasm-target" before building.
graviplex = { git = "https://github.com/dIB59/Graviplex.git", branch = "wasm-target", features = ["gui", "physics"] }
bytemuck = "1.22.0"
wgpu = { version = "26.0.1", features = ["webgl"] }
winit = "0.30.7"
egui = { version = "0.33.0", default-features = true }
egui-winit = { version = "0.33.0", default-features = false }
ultraviolet = "0.9.2"
rand = "0.9.2"
rayon = { version = "1.10", optional = true }
pollster = "0.4.0"
env_logger = "0.11.6"
log = "0.4.22"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Performance",
    "Location",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
